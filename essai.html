<!doctype html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloc-notes</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px 16px; background: #f4f6fa; color: #1b1d22; }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #eef0f4; } textarea { background: #22252c; color: #eef0f4; border-color: #3a3f4a; } }
  h1 { font-size: 1.4em; margin: 0 0 12px; }
  p { margin: 0 0 16px; opacity: .7; }
  textarea { width: 100%; box-sizing: border-box; min-height: 40vh; font: 1.25em system-ui, sans-serif; padding: 14px; border: 2px solid #c9d0dc; border-radius: 16px; }
</style>
</head>
<body>
<h1>📝 Bloc-notes</h1>
<p>Une page d'essai toute simple : touche le champ, puis dicte.</p>
<textarea placeholder="Écris ou dicte ici…"></textarea>

</html>
